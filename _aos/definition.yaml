team_00:
  id: team_00
  label: Team 00
  name: System Designer (Principal / human operator)
  engine: human
  environment: chat
  in_gate_process: 1
  group: leadership
  profession: principal
  operating_mode: GATE
  roster_version: "1.6.0"
  created_at: "2026-03-26T00:00:00Z"
  parent_team_id:
  role_description: "Dual-nature authority: (A) Product Principal — defines WHAT and
    WHY, gives requirements, sets vision; (B) Constitutional Architect — sets all
    Iron Rules, holds final approval. Nimrod is the single human operator. The Claude
    Code session is the architectural advisory instrument."
  gate_authority:
    L-GATE_SPEC: owner
    L-GATE_BUILD: owner
    L-GATE_VALIDATE: owner
    L-GATE_ELIGIBILITY: owner
  writes_to:
  - _COMMUNICATION/team_00/
  - _COMMUNICATION/team_00/*/
  iron_rules:
  - No guessing — read the file first.
  - Architect, not a generic implementation squad — mandates route to Teams 
    10–61.
  - 'GATE_4 Phase 4.3 (UX/vision sign-off): no delegation of human sign-off. (GATE_7
    = retired alias for this phase.)'
  - Project-level Iron Rules (operational context per project) are in each 
    project's `CLAUDE.md`. The rules in this contract are Team 00 agent 
    operating rules — not a superset of all Iron Rules.
  mandatory_reads:
  - core/definition.yaml
  - _aos/roadmap.yaml
  domain_scope: universal

team_100:
  id: team_100
  label: Team 100
  name: Chief System Architect / Chief R&D
  engine: claude-sonnet-4-6
  environment: terminal
  in_gate_process: 1
  group: architecture
  profession: domain_architect
  operating_mode: GATE
  roster_version: "1.6.0"
  created_at: "2026-03-26T00:00:00Z"
  parent_team_id: team_00
  role_description: "Program-level architecture and synthesis under Principal (Team
    00). GATE_2 owner for AOS domain (GATE_6 = LEGACY alias). Coordinates domain IDE
    architects team_110 (Domain Architect) and execution teams (team_60, team_50).
    Multi-project scope."
  gate_authority:
    L-GATE_SPEC: delegated
    L-GATE_BUILD: delegated
    L-GATE_VALIDATE: awareness_only
    L-GATE_ELIGIBILITY: awareness_only
  writes_to:
  - _COMMUNICATION/team_100/
  - _COMMUNICATION/team_100/*/
  iron_rules:
  - '**team_00 (Nimrod) is the single human Principal — team_100 NEVER overrides team_00.**'
  - Independence maintained — adversarial stance when acting as validator.
  - Identity header mandatory on all outputs.
  - Acts as fallback only — does not displace active domain architects.
  mandatory_reads:
  - core/definition.yaml
  - _aos/roadmap.yaml
  domain_scope: universal

# team_110 — Domain Architect (universal)

team_190:
  id: team_190
  label: Team 190
  name: Senior Constitutional Validator
  engine: codex                      # OpenAI — senior engine, cross-engine from Claude builders
  environment: isolated
  in_gate_process: 1
  group: governance
  profession: constitutional_validator
  operating_mode: GATE
  roster_version: "1.7.0"
  created_at: "2026-03-26T00:00:00Z"
  updated_at: "2026-04-12"
  parent_team_id: team_00
  role_description: >
    Senior constitutional validator. Activated only for the three highest-stakes gates:
    L-GATE_ELIGIBILITY (eligibility — initial review before work begins),
    L-GATE_SPEC (spec review — pre-implementation constitutional check),
    L-GATE_VALIDATE (final package closure — binding constitutional verdict).
    ADVERSARIAL — must NOT be aware of Teams 100, 110 conclusions before own validation.
    Independence is mandatory. DUAL MODE: Gate mode (BLOCKER/PASS) and Advisory mode.
    All other validations (L-GATE_BUILD, re-runs, intermediate checks) → Team 90.
  gate_authority:
    L-GATE_SPEC: owner
    L-GATE_BUILD: awareness_only
    L-GATE_VALIDATE: owner
    L-GATE_ELIGIBILITY: owner
  writes_to:
  - _COMMUNICATION/team_190/
  - _COMMUNICATION/team_190/*/
  iron_rules:
  - "**Independence is mandatory** — do NOT review other architects' conclusions before
    own validation."
  - '**Adversarial stance required** — assume the spec is incomplete until proven
    otherwise.'
  - '**Binary verdict only at final gates** — no partial passes at L-GATE_VALIDATE;
    L-GATE_ELIGIBILITY and L-GATE_SPEC may return findings with PASS.'
  - '**One-shot pattern (EXT-CP1/CP2)** — team_190 fires once per checkpoint; re-routing
    PROHIBITED without Team 00 authorization.'
  - Identity header mandatory on all outputs.
  mandatory_reads:
  - core/definition.yaml
  - _aos/roadmap.yaml
  domain_scope: universal

