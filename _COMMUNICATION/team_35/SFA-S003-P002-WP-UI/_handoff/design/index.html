<style>
  /* Canvas background — Cool Stone paper deepened */
  body { background: #ecebe2; }

  /* ========== Shared module shell (used by both modules) ========== */
  .sfa-shell {
    width: 390px;
    min-height: 844px;
    background: var(--paper);
    color: var(--ink);
    direction: rtl;
    font-family: "Assistant", "Heebo", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    overflow: hidden;
    position: relative;
    display: flex; flex-direction: column;
  }
  .sfa-shell * { box-sizing: border-box; }

  /* Header */
  .sfa-h {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .sfa-h__mark {
    width: 28px; height: 28px;
    flex: none;
    display: grid; place-items: center;
  }
  .sfa-h__title { font-family: "Frank Ruhl Libre", serif; font-weight: 700; font-size: 17px; letter-spacing: -.01em; line-height: 1; }
  .sfa-h__sub   { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .08em; color: var(--ink-soft); text-transform: uppercase; margin-top: 3px; }
  .sfa-h__spacer { flex: 1; }
  .sfa-h__icon {
    width: 32px; height: 32px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    border-radius: var(--radius-pill);
    color: var(--ink-soft);
  }

  /* Module tabs */
  .sfa-tabs {
    display: grid; grid-template-columns: 1fr 1fr;
    background: var(--paper-2);
    padding: 4px;
    margin: 10px 16px 0;
    border-radius: var(--radius-pill);
    font-size: 14px;
  }
  .sfa-tabs__btn {
    appearance: none; border: 0; background: transparent;
    padding: 9px 12px;
    border-radius: var(--radius-pill);
    font-weight: 600; color: var(--ink-soft);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: inherit;
  }
  .sfa-tabs__btn.is-active { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-s); }
  .sfa-tabs__btn .dot { width: 7px; height: 7px; border-radius: 50%; }
  .sfa-tabs__btn[data-mod="market"] .dot { background: var(--w-know); }
  .sfa-tabs__btn[data-mod="book"]   .dot { background: var(--w-soil); }

  /* Content scroll area */
  .sfa-body { flex: 1; overflow: auto; padding: 14px 16px 80px; }

  /* Footer (sticky-ish freshness + source) */
  .sfa-foot {
    border-top: 1px solid var(--line);
    padding: 9px 16px;
    background: var(--paper-2);
    font-size: 11px; color: var(--ink-soft);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: "JetBrains Mono", monospace;
    letter-spacing: .02em;
  }
  .sfa-foot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--w-soil); }
  .sfa-foot__sep { opacity: .35; }

  /* ===== Reusable bits ===== */
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 600; line-height: 1.4; }
  .pill--soil { background: color-mix(in oklch, var(--w-soil) 18%, var(--paper)); color: var(--w-soil-deep); }
  .pill--know { background: color-mix(in oklch, var(--w-know) 18%, var(--paper)); color: var(--w-know-deep); }
  .pill--code { background: color-mix(in oklch, var(--w-code) 18%, var(--paper)); color: var(--w-code-deep); }
  .pill--muted { background: var(--paper-2); color: var(--ink-soft); }
  .pill--warn { background: #fde9d4; color: #8a4a14; }
  .pill--spark { background: var(--spark); color: #fff; }

  /* Wireframe style: greyboxes + labels */
  .wf {
    background: var(--paper);
    color: var(--ink);
    font-family: "JetBrains Mono", "Assistant", monospace;
    font-size: 12px;
    line-height: 1.45;
  }
  .wf .sfa-h__title { font-family: "JetBrains Mono", monospace; font-size: 14px; }
  .wf .sfa-h__sub   { font-family: inherit; }
  .wf .box { border: 1.5px dashed #b8b3a0; border-radius: 6px; padding: 8px 10px; color: #6e6856; background: #fdfdf8; }
  .wf .box--solid { border-style: solid; }
  .wf .box--filled { background: #ddd8c4; border-color: #b8b3a0; }
  .wf .lbl { font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: #8b8772; margin-bottom: 4px; font-weight: 600; }
  .wf .row { display: flex; gap: 8px; align-items: center; }
  .wf .stack { display: flex; flex-direction: column; gap: 8px; }
  .wf .h-line { height: 1px; background: #cdc8b3; margin: 6px 0; }
  .wf .strip { display: flex; gap: 4px; }
  .wf .strip > div { flex: 1; height: 10px; background: #ddd8c4; border-radius: 2px; }
  .wf .strip > div.f { background: #b8b3a0; }
  .wf .ann { color: #b04a26; font-size: 10px; font-style: italic; margin-top: 4px; display: block; }

  /* Mockup chrome (LOD300) */
  .mock {}

  /* Cards (mockup market) */
  .pcard {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius-m); padding: 12px;
    margin-bottom: 10px;
  }
  .pcard__head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .pcard__glyph {
    width: 32px; height: 32px; flex: none;
    border-radius: 8px;
    display: grid; place-items: center;
    background: color-mix(in oklch, var(--w-know) 18%, var(--paper));
    color: var(--w-know-deep);
    font-weight: 700; font-size: 14px;
    font-family: "Frank Ruhl Libre", serif;
  }
  .pcard__name { font-weight: 700; font-size: 15px; line-height: 1.1; }
  .pcard__unit { font-size: 11px; color: var(--ink-soft); }
  .pcard__price {
    display: flex; align-items: baseline; gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .pcard__price .big {
    font-family: "Frank Ruhl Libre", serif;
    font-weight: 700; font-size: 24px;
    color: var(--w-know-deep);
    line-height: 1;
  }
  .pcard__price .cur { font-size: 13px; color: var(--ink-soft); }
  .pcard__price .med {
    margin-inline-start: auto;
    font-size: 11px; color: var(--ink-soft);
  }
  .pcard__range {
    margin-top: 10px;
    position: relative; height: 4px;
    background: var(--paper-3); border-radius: 2px;
  }
  .pcard__range .fill {
    position: absolute; top: 0; bottom: 0;
    background: linear-gradient(to left, var(--w-know), var(--w-know-deep));
    border-radius: 2px;
  }
  .pcard__range-text { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-soft); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .pcard__meta { display: flex; gap: 10px; margin-top: 10px; font-size: 11px; color: var(--ink-soft); }
  .pcard__meta .sources { display: inline-flex; gap: 2px; }
  .pcard__meta .sources span { width: 5px; height: 5px; border-radius: 50%; background: var(--w-know); }

  /* Crop card */
  .ccard {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius-m); padding: 12px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .ccard__icon {
    width: 44px; height: 44px; flex: none;
    border-radius: 10px;
    background: color-mix(in oklch, var(--w-soil) 16%, var(--paper));
    color: var(--w-soil-deep);
    display: grid; place-items: center;
    font-family: "Frank Ruhl Libre", serif;
    font-weight: 700; font-size: 18px;
  }
  .ccard__body { flex: 1; min-width: 0; }
  .ccard__name { font-weight: 700; font-size: 15px; line-height: 1.15; }
  .ccard__en { font-size: 11px; color: var(--ink-soft); font-style: italic; margin-top: 1px; }
  .ccard__meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

  /* Crop detail tab strip */
  .ctabs {
    display: flex; gap: 4px;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    margin: 0 -16px 12px;
    padding: 0 16px;
    scrollbar-width: none;
  }
  .ctabs::-webkit-scrollbar { display: none; }
  .ctabs button {
    appearance: none; border: 0; background: transparent;
    padding: 10px 4px;
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    border-bottom: 2px solid transparent;
    white-space: nowrap; cursor: pointer;
  }
  .ctabs button.is-active { color: var(--w-soil-deep); border-bottom-color: var(--w-soil-deep); }

  /* Timeline */
  .timeline {
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    background: var(--paper);
    padding: 12px;
  }
  .timeline__ruler { display: flex; gap: 0; margin-bottom: 6px; font-size: 10px; color: var(--ink-soft); }
  .timeline__ruler span { flex: 1; text-align: center; border-inline-end: 1px solid var(--paper-3); padding: 2px 0; }
  .timeline__ruler span:last-child { border-inline-end: 0; }
  .timeline__bar { display: flex; height: 24px; border-radius: 6px; overflow: hidden; }
  .timeline__seg { color: #fff; font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
  .timeline__seg--prep   { background: #78909c; }
  .timeline__seg--grow   { background: var(--w-soil); }
  .timeline__seg--harv   { background: var(--w-know); }

  /* Bold Direction B accents */
  .boldB { font-family: "Frank Ruhl Libre", serif; }
  .underline-spark {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 8'><path d='M2 5 Q 50 1 100 4 T 198 5' stroke='%23c46a3e' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-position: bottom right;
    background-size: 100% 8px;
    padding-bottom: 4px;
  }

  /* Mental model artboard */
  .mental {
    width: 100%; height: 100%;
    padding: 28px 32px;
    background: var(--paper);
    overflow: auto;
  }

  /* ARTBOARD overrides — design canvas centers/scales us */
  [data-dc-artboard] { background: var(--paper); }
</style>
