<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>כניסה — MyFarmAgents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Heebo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f0e8;
    }
    .login-card { max-inline-size: 400px; box-shadow: 0 4px 24px rgba(27, 67, 50, 0.1); border-radius: 12px; }
    .login-card h1 { font-family: 'Frank Ruhl Libre', serif; color: #1b4332; }
  </style>
</head>
<body>
  <div class="card login-card shadow border-0">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1">🌿 MyFarmAgents</h1>
      <p class="text-muted text-center small mb-4">ניהול מקומי</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} small" role="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      <form method="post" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label" for="email">אימייל</label>
          <input type="email" class="form-control ltr" dir="ltr" name="email" id="email" value="{{ email }}" required autocomplete="username">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">סיסמה</label>
          <input type="password" class="form-control ltr" dir="ltr" name="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-success w-100">כניסה</button>
      </form>
    </div>
  </div>
</body>
</html>
