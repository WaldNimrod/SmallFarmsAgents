<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    SFA icon sprite — vegetable + generic icons.
    All symbols use viewBox 0 0 24 24, stroke="currentColor", fill="none"
    so CSS can color them via `color: var(--gj-leaf-deep)` etc.
    Shapes derived from team_35 illustrations.jsx (watercolor source of truth),
    re-rendered as calm-craft line work to fit the design's sketched aesthetic.
  -->

  <!-- icon-leaf: generic crop fallback (kept; redrawn at 24×24 to match new system) -->
  <symbol id="icon-leaf" viewBox="0 0 24 24">
    <path d="M20 4c-9 0-15 5-15 12v4h4c7 0 12-5 12-12V4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M7 17c3-4 7-7 11-9" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- icon-seedling: hub home tier card -->
  <symbol id="icon-seedling" viewBox="0 0 24 24">
    <path d="M12 21V11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M12 11c-3 0-5-2-5-5 3 0 5 2 5 5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M12 12c3 0 5-2 5-5-3 0-5 2-5 5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M5 21h14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- icon-tomato: round fruit + stem + small leaves (from Tomato()) -->
  <symbol id="icon-tomato" viewBox="0 0 24 24">
    <circle cx="12" cy="14" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M8 7c1.3-1.6 2.7-1 4-0.4 1.3-0.6 2.7-1.2 4 0.4-1.3 1-2.7 1-4 0.6-1.3 0.4-2.7 0.4-4-0.6z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M12 6V3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M9 6.5L7.8 4.8" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <path d="M15 6.5l1.2-1.7" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
  </symbol>

  <!-- icon-lettuce: layered ruffled leaves (from Lettuce()) -->
  <symbol id="icon-lettuce" viewBox="0 0 24 24">
    <path d="M3 13c0-3 3-5 5-5 1-1.5 3-2 4-2s3 0.5 4 2c2 0 5 2 5 5 0 1.5-1 3-2 3.5H5C4 16 3 14.5 3 13z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M8 8.5c0.5 2 1 4 1 6" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <path d="M12 6c0 3 0 6 0 9" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <path d="M16 8.5c-0.5 2-1 4-1 6" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <path d="M6 17l1 3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M12 17v3.5" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M18 17l-1 3" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
  </symbol>

  <!-- icon-cucumber: rotated elongated capsule + seed dots (from Cucumber()) -->
  <symbol id="icon-cucumber" viewBox="0 0 24 24">
    <path d="M5.5 18.5c-1.2-1.2-1.2-3 0-4.2L15 4.8c1.2-1.2 3-1.2 4.2 0s1.2 3 0 4.2L9.7 18.5c-1.2 1.2-3 1.2-4.2 0z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M7.5 16.5l-1 1.5" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <path d="M17 6.5l1-1.2" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>
    <circle cx="9" cy="14" r="0.6" fill="currentColor"/>
    <circle cx="11.5" cy="11.5" r="0.6" fill="currentColor"/>
    <circle cx="14" cy="9" r="0.6" fill="currentColor"/>
  </symbol>

  <!-- icon-pepper: bell-pepper body + stem (from Pepper()) -->
  <symbol id="icon-pepper" viewBox="0 0 24 24">
    <path d="M5 12c0 5 3 8 7 8s7-3 7-8c0-2-1-3.5-2.5-3.5-1 0-1.5 0.5-2.5 0.5h-4c-1 0-1.5-0.5-2.5-0.5C6 8.5 5 10 5 12z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M9 9c0.5-1.5 2-2 3-2s2.5 0.5 3 2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M12 6.5V3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
  </symbol>

  <!-- icon-eggplant: pear-shape body + crown leaves -->
  <symbol id="icon-eggplant" viewBox="0 0 24 24">
    <path d="M7 20c-2-1.5-3-4-3-7 0-4 3-7 7-7 2 0 3 0.5 4 1.5 1 1 2 3 2 5 0 4-3 8-7 8-1 0-2 0-3-0.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M10 7c-1-1.5-1-3 0-4 0.5 1 1.5 1.5 2.5 1.5s2-0.5 2.5-1.5c1 1 1 2.5 0 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M12.5 4.5V2.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  </symbol>

  <!-- icon-carrot: tapered root + leafy top (from Carrot()) -->
  <symbol id="icon-carrot" viewBox="0 0 24 24">
    <path d="M8 10l4 11 4-11c-1.2-0.6-2.6-0.8-4-0.8s-2.8 0.2-4 0.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M10 13l-1 5" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M12 13v6" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M14 13l1 5" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M12 9.5V6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M12 8c-1.5 0-3-1-3.5-2.5C10 5 11.5 6 12 8z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M12 8c1.5 0 3-1 3.5-2.5C14 5 12.5 6 12 8z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M12 7c0-1.5 0.5-3 1.5-4-0.5 1.5-0.5 3 0 4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
  </symbol>

  <!-- icon-onion: bulb + 3 sprouts + horizontal grain lines (from Onion()) -->
  <symbol id="icon-onion" viewBox="0 0 24 24">
    <path d="M5 14c0-4 3-7 7-7s7 3 7 7c0 4-3 7-7 7s-7-3-7-7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M7 13c1.5 1 3.5 1.5 5 1.5s3.5-0.5 5-1.5" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M7.5 16c1.5 0.8 3 1.2 4.5 1.2s3-0.4 4.5-1.2" fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M10 7c-0.5-1.5-1.5-2.8-3-3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M12 7V3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M14 7c0.5-1.5 1.5-2.8 3-3.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  </symbol>

  <!-- icon-zucchini: elongated fruit + stem cap (similar to cucumber but vertical with broader head) -->
  <symbol id="icon-zucchini" viewBox="0 0 24 24">
    <path d="M9 21.5c-1.5 0-2.5-1-2.5-2.5V10c0-2 1-3.5 2.5-4.5 1-0.7 2-1 3-1s2 0.3 3 1c1.5 1 2.5 2.5 2.5 4.5v9c0 1.5-1 2.5-2.5 2.5h-6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M9 5.5c0.5-1 1.5-2 3-2s2.5 1 3 2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M12 3.5V2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M9 12h6" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
    <path d="M9 15h6" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>
  </symbol>
</svg>
