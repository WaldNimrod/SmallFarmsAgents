# SFA Modules Registry — single source of truth
#
# This YAML is the canonical catalog. Mirror in PHP as `sfa_modules.php`.
# Adding a module = add an entry below + run `sfa_register_modules()`.
#
# Schema:
#   id            kebab-case unique id
#   name_he       display name (Hebrew)
#   name_en       display name (English, for SEO/dev refs)
#   sub           short sub-title (Hebrew)
#   tier          one of: open | beta | coming | paid | custom
#   icon          maps to a key in illustrations.jsx::CROP_ICON
#                  one of: tomato | lettuce | cucumber | carrot | pepper |
#                          onion | basil | strawberry
#   thumb_prompt  key in art-prompts.jsx::PROMPTS for AI-rendered 1:1 thumb
#   stat          short stat line shown under the card (Hebrew)
#   stat_count    optional integer shown in the sidebar nav
#   color         one of: leaf | tomato | sun | soil | paper
#   route         WP-relative URL
#   shortcode     existing or new shortcode to embed in the WP page body
#   status        development status: live | beta | planned | custom

version: "1.0.0"
updated: 2026-05-24

tiers:
  open:
    label_he: "כלים לקהילה"
    short_he: "פתוח"
    color: leaf
    description_he: "שירות ציבורי פתוח — נתונים מצרפיים, השוואת גורפים, בלי הרשמה ובלי תשלום. תרומה לקהילה החקלאית."
  beta:
    label_he: "בטא · ניסיוני"
    short_he: "בטא"
    color: sun
    description_he: "בפיתוח פעיל. ייתכנו שינויים, מוזמנים לתת פידבק."
  coming:
    label_he: "בקרוב"
    short_he: "בקרוב"
    color: paper
    description_he: "אנחנו עובדים על זה. השאירו פרטים כדי לקבל הודעה כשנפתח."
  paid:
    label_he: "כלים מתקדמים"
    short_he: "בתשלום"
    color: soil
    description_he: "יכולות תפעוליות מורחבות לחוות פעילות — תמחור לפי גודל ושימוש."
  custom:
    label_he: "בדיוק לחווה שלך"
    short_he: "בהזמנה"
    color: tomato
    description_he: "אינטגרציות וכלים מותאמים אישית — דברו איתנו, נתפור עבורכם."

